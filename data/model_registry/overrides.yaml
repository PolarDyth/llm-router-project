# Hand-maintained overrides for the model complexity registry.
# Everything here wins over the automated price/quality scoring.
#
# models:
#   <canonical_id>:
#     complexity: 3          # force the integer tier (required to CREATE an entry)
#     score: 3.2             # force the continuous score
#     released: "2024-05-13"
#     display_name: "GPT-4o"
#     notes: "why this override exists"
#     aliases:               # EXTRA aliases merged into the entry
#       - "some-other-name"
#     signals:               # patch individual signals (nulls ignored)
#       params_b: 70
#
# excludes: [<canonical_id>, ...]   # drop junk merge groups entirely

excludes:
  - anthropic/claude        # bare "claude" junk group; real models are claude-1/2/instant

